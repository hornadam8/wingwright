# Cross-compiling the Windows build from macOS: `cargo build --release --target x86_64-pc-windows-gnu`
# (needs `brew install mingw-w64` and `rustup target add x86_64-pc-windows-gnu`).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
# Link the GCC runtime statically so the .exe does not need libgcc_s_seh-1.dll / libwinpthread-1.dll.
rustflags = ["-C", "link-arg=-static-libgcc", "-C", "link-arg=-Wl,-Bstatic", "-C", "link-arg=-lwinpthread", "-C", "link-arg=-Wl,-Bdynamic"]
